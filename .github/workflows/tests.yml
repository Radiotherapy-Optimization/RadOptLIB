# Runs the test suite on pushes and pull requests that change the package or its tests (synthetic instances
# only, no downloads). Docs, manifest, dashboard and examples are not used by the tests.
name: Tests

on:
  push:
    paths: &code_paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths: *code_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest highspy
      - name: Tests
        run: python -m pytest -q